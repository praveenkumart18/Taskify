<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Taskify - Multi-User Task Management & Smart Picker</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('taskify_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Taskify is a multi-user task management application with categorized lists and a smart random task picker powered by MongoDB." />
    <meta property="og:title" content="Taskify - Multi-User Task Management & Smart Picker" />
